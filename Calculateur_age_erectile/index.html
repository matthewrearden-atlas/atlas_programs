            padding: 16px 20px 0

            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 22px
        }

        .back {
            background: none;
            border: none;
            color: var(--gris);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            line-height: 1
        }

        .back:hover {
            color: var(--or)
        }

        .bar-wrap {
            flex: 1
        }

        .bar-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--gris);
            letter-spacing: 1px;
            margin-bottom: 5px
        }

        .bar-top .st {
            text-transform: uppercase
        }

        .bar {
            height: 4px;
            background: #1b1b1e;
            border-radius: 99px
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--orF), var(--or));
            border-radius: 99px;
            transition: width .4s ease
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px 0

            color: var(--gris);
            text-align: center;
            margin-bottom: 8px
        }

        .scr {

        }

            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(26px)
            }

            to {
                opacity: 1;

            }

        .center {

            font-size: 16px;
            font-weight: 600;

            color: var(--blanc);

        }

            border-radius: 10px;
            background: var(--carte);
            border: 1px solid var(--bord);
            color: var(--blanc);
            font-size: 15px;
            outline: none
        }

        .card {
            background: var(--carte);
            border: 1px solid var(--bord);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color .25s ease
        }

        .card.open {
            border-color: var(--or)

        .card-h {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 15px;
            background: none;
            border: none;
            color: var(--blanc);
            cursor: pointer;

        .card-t {

            font-size: 14.5px;
            color: var(--or)

        .card-r {
            display: block;
            font-size: 12.5px;
            color: var(--gris)
        }

        .card-chev {
            color: var(--gris);

        }

        .card.open .card-chev {
            transform: rotate(180deg)
        }

        .card-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height .32s ease, opacity .28s ease
        }

        .card.open .card-panel {
            max-height: 240px;
            opacity: 1
        }

        .card-txt {
            padding: 0 15px 14px 45px;
            font-size: 14px;
            color: var(--blafard);
            line-height: 1.55
        }

        .reveal {
            opacity: 0;
            transition: opacity .5s ease
        }

        .reveal.on {
            opacity: 1
        }

        *::-webkit-scrollbar {
            width: 7px
        }

        *::-webkit-scrollbar-thumb {
            background: #2a2a2e;
            border-radius: 9px
        }

        a {
            color: var(--or)
        }

        code {
            color: var(--or)
        }
    </style>
</head>

                    label = "Démarrer mon bilan →";
                    break;
                case "stat1":
                case "iceberg":
                case "stat78":
                    hint = "Prochaine étape : quelques questions sur toi.";
                    break;
                case "recap":
                    label = "Passons au plus précis →";
                    break;
                case "result":
                    label = "Voir ce que je peux faire →";
                    break;
                case "birth":
                    disabled = !ans._birthReady;
                    act = "birth";
                    break;
                case "imc":
                    disabled = !ans._imcReady;
                    act = "imc";
                    break;
                case "single22":
                    disabled = !ans.q22;
                    break;
                case "multi":
                    disabled = !(ans[step.id] && ans[step.id].length);
                    break;
                case "approval":
                    if (seatsTaken() >= 7) {
                        label = "Rejoindre la liste d'attente →";
                        act = "waitlist";
                    } else {
                        label = "Je veux rajeunir mes érections →";
                        act = "book";
                    }
                    break;
            }
            ftr.style.display = "block";
            inn.innerHTML = (hint ? '<div class="hint">' + hint + '</div>' : '') +
                '<button class="cta" id="footBtn" data-act="' + act + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button>';
        }

        /* ===================== ANIMATIONS ===================== */
        function animateCount(to, dur, from, onFrame, onDone) {
            var start = null;

            function tick(t) {
                if (start === null) start = t;
                var p = Math.min(1, (t - start) / dur),
                    v = Math.round(from + (to - from) * easeOut(p));
                onFrame(v, p);
                if (p < 1) requestAnimationFrame(tick);
                else if (onDone) onDone();
            }
            requestAnimationFrame(tick);
        }

        function postRender(step) {
            if (step.kind === "iceberg") {
                animateCount(28, 1100, 0, function(v) {
                    var e = document.getElementById("ice28");
                    if (e) e.textContent = v;
                });
                animateCount(72, 1300, 0, function(v) {
                    var e = document.getElementById("ice72");
                    if (e) e.textContent = v;
                });
            }
            if (step.kind === "stat78") {
                animateCount(78, 1100, 0, function(v) {
                    var e = document.getElementById("s78");
                    if (e) e.textContent = v;
                });
            }
            if (step.kind === "result") {
                var c = computed();
                animateCount(c.ea, 1800, c.realAge, function(v, p) {
                    var num = document.getElementById("eaNum"),
                        suf = document.getElementById("eaSuf");
                    if (!num) return;
                    var size = 56 + 44 * p;
                    num.textContent = v;
                    num.style.fontSize = size + "px";
                    num.style.color = lerpHex("#C9A84C", c.col, p);
                    if (suf) suf.style.fontSize = (size * 0.34) + "px";
                }, function() {
                    var a = document.getElementById("rvAge"),
                        r = document.getElementById("rvRest");
                    if (a) a.classList.add("on");
                    if (r) r.classList.add("on");
                });
            }
        }

        /* ===================== ÉVÉNEMENTS ===================== */
        document.addEventListener("click", function(e) {
            var el = e.target.closest("[data-act]");
            if (!el) return;
            var act = el.getAttribute("data-act");
            if (act === "back") {
                go(-1);
            } else if (act === "next") {
                go(1);
            } else if (act === "single") {
                setSingle(el.getAttribute("data-qid"), el.getAttribute("data-label"), parseFloat(el.getAttribute("data-pts")) || 0);
            } else if (act === "multi") {
                var qid = el.getAttribute("data-qid"),
                    label = el.getAttribute("data-label");
                var cur = ans[qid] || [];
                var k = cur.indexOf(label);
                if (k >= 0) cur.splice(k, 1);
                else cur.push(label);
                ans[qid] = cur;
                var on = k < 0;
                el.classList.toggle("sel", on);
                var chk = el.querySelector(".chk");
                if (chk) chk.textContent = on ? "✓" : "";
                var bm = document.getElementById("footBtn");
                if (bm) bm.disabled = !cur.length;
            } else if (act === "pick22") {
                ans.q22 = el.getAttribute("data-label");
                var sibs = el.parentNode.querySelectorAll(".opt");
                for (var s = 0; s < sibs.length; s++) sibs[s].classList.toggle("sel", sibs[s] === el);
                var b22 = document.getElementById("footBtn");
                if (b22) b22.disabled = false;
            } else if (act === "acc") {
                var idx = +el.getAttribute("data-idx");
                var card = el.closest(".card");
                var wasOpen = card.classList.contains("open");
                var all = document.querySelectorAll(".card");
                for (var j = 0; j < all.length; j++) all[j].classList.remove("open");
                if (!wasOpen) card.classList.add("open");
            } else if (act === "birth") {
                if (ans._birthReady) submitBirth();
            } else if (act === "imc") {
                if (ans._imcReady) submitImc();
            } else if (act === "book") {
                bookOrWaitlist(false);
            } else if (act === "waitlist") {
                bookOrWaitlist(true);
            }
        });
        document.addEventListener("change", function(e) {
            var el = e.target;
            if (el.classList.contains("js-birth")) {
                var part = el.getAttribute("data-part");
                ans["_b" + part] = el.value;
                if (part === "m" || part === "y") rebuildDays();
                updateBirthReady();
            }
        });
        document.addEventListener("input", function(e) {
            var el = e.target;
            if (el.classList.contains("js-imc")) {
                ans["_" + el.getAttribute("data-part")] = el.value;
                var ready = ans._t && ans._p && (+ans._p) >= 30;
                ans._imcReady = !!ready;
                var b = document.getElementById("footBtn");
                if (b) b.disabled = !ready;
            }
        });

        function updateBirthReady() {
            var ready = ans._bd && ans._bm && ans._by;
            ans._birthReady = !!ready;
            var b = document.getElementById("footBtn");
            if (b) b.disabled = !ready;
        }

        function submitBirth() {
            var now = new Date(),
                maxY = now.getFullYear();
            var age = maxY - (+ans._by);
            var md = (now.getMonth() + 1) - (+ans._bm);
            if (md < 0 || (md === 0 && now.getDate() < (+ans._bd))) age--;
            ans._age = age;
            if (age < 18) {
                blocked = true;
                render();
                return;
            }
            go(1);
        }

        function rebuildDays() {
            var dsel = document.querySelector('.js-birth[data-part="d"]');
            if (!dsel) return;
            if (!ans._bm || !ans._by) return;
            var maxD = daysInMonth(+ans._bm, +ans._by),
                cur = +ans._bd || 0;
            if (cur > maxD) ans._bd = "";
            var o = '<option value="">Jour</option>';
            for (var dd = 1; dd <= maxD; dd++) o += '<option value="' + dd + '"' + (cur === dd && cur <= maxD ? ' selected' : '') + '>' + dd + '</option>';
            dsel.innerHTML = o;
        }

        function submitImc() {
            var imc = (+ans._p) / Math.pow((+ans._t) / 100, 2);
            ans._imc = imc.toFixed(1);
            pts.q5 = imcPts(imc);
            go(1);
        }
        /* recalc readiness après un render de birth (les selects gardent leurs valeurs via ans._b*) */
        var _origRender = render;
        render = function() {
            _origRender();
            if (FLOW[i].kind === "birth") {
                updateBirthReady();
            }
        };

        /* ===================== START ===================== */
        render();
    </script>
</body>

</html>
